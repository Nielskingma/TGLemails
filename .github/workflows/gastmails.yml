name: Gastenmails The Green Lodge

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gastmails
  cancel-in-progress: false

jobs:
  verstuur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verstuur gastenmails
        env:
          STRATO_EMAIL: ${{ secrets.STRATO_EMAIL }}
          STRATO_WACHTWOORD: ${{ secrets.STRATO_WACHTWOORD }}
        run: python3 gastmails/verstuur_gastmails.py

      - name: Bewaar verzendlog
        run: |
          if ! git diff --quiet -- gastmails/verzonden_log.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add gastmails/verzonden_log.json
            git commit -m "Update verzendlog gastenmails"
            git push
          fi
